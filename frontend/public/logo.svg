<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 음표 모양 -->
  <path d="M60 20 L60 80 M60 20 Q40 20 40 40 Q40 60 60 60 Q80 60 80 40 Q80 20 60 20" 
        stroke="url(#gradient1)" 
        stroke-width="4" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- 움직임을 나타내는 파형 -->
  <path d="M30 90 Q40 85 50 90 T70 90 T90 90" 
        stroke="url(#gradient2)" 
        stroke-width="3" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- 손 모양 (모션 인식) -->
  <circle cx="25" cy="50" r="8" fill="url(#gradient1)" opacity="0.8"/>
  <circle cx="95" cy="50" r="8" fill="url(#gradient2)" opacity="0.8"/>
  
  <!-- 음악 파형 -->
  <path d="M20 100 L20 95 L25 100 L25 95 L30 100 L30 95 L35 100 L35 95" 
        stroke="url(#gradient1)" 
        stroke-width="2" 
        stroke-linecap="round"/>
  <path d="M85 100 L85 95 L90 100 L90 95 L95 100 L95 95 L100 100 L100 95" 
        stroke="url(#gradient2)" 
        stroke-width="2" 
        stroke-linecap="round"/>
</svg>

